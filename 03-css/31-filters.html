<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Advanced Selectors</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .caja-filtro img {
            width: 100%;
            height: 200px;        
            object-fit: contain;
        }

        .galeria-filtros .caja-filtro:nth-child(1) img {
            filter: grayscale(100%);
        }

        .galeria-filtros .caja-filtro:nth-child(2) img {
            filter: blur(4px);
        }

        .galeria-filtros .caja-filtro:nth-child(3) img {
            filter: sepia(100%);
        }

        .galeria-filtros .caja-filtro:nth-child(4) img {
            filter: brightness(1.5) contrast(1.8);
        }

        .galeria-filtros .caja-filtro:nth-child(5) img {
            filter: saturate(300%);
        }

        .galeria-filtros .caja-filtro:nth-child(6) img {
            filter: invert(100%);
        }

        .galeria-filtros .caja-filtro:nth-child(7) img {
            filter: drop-shadow(8px 8px 10px rgba(253, 4, 4, 0.8));
        }

        .galeria-filtros .caja-filtro:nth-child(8) img {
            filter: grayscale(50%) blur(2px) brightness(1.2) contrast(1.2) sepia(30%);
        }
        
    
    </style>
</head>
