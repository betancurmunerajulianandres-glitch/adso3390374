                        8px 8px 0 #403300,
                        9px 9px 0 #1a1400,

            &.txt4 {
                color: #fff;
                text-shadow:
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px #ffcd00,
                    0 0 40px #ffcd00,
