        <header class="mainmenu">
            <h1>12-graphics</h1>
            <h4>Crea formularios interactivos para entradas de usuario.</h4>
        </header>
        <section>
            <h3>Canva</h3>
                <canvas id="miCanvas" width="200" height="200"></canvas>
    <script>
    const canvas = document.getElementById('miCanvas');
    const ctx = canvas.getContext('2d');

    ctx.beginPath();
    ctx.arc(100, 100, 50, 0, 2 * Math.PI); // (x, y, radio, inicio, fin)
    ctx.fillStyle = 'white';
    ctx.fill();
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    ctx.stroke();
    </script>
            
            <h3>svg</h3>
            <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="50" fill="white" stroke="black" stroke-width="3" />
    </svg>
            
            </svg>
        </section>

    </main>
